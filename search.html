<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Products — Madhav Polymers</title>
  <meta name="description" content="Search sealing solutions, rubber gaskets, UPVC profiles, aluminium sections, and polymer products by Madhav Polymers.">
  <link rel="icon" type="image/png" href="assets/madhav-emblem-opt.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/search.css">
  <style>
    .search-page-section {
      padding: 40px 0 80px;
      background: var(--cream-50, #fcfbf7);
      min-height: 70vh;
    }

    .search-header-box {
      max-width: 850px;
      margin: 0 auto 30px;
      text-align: center;
    }

    .search-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      margin-top: 20px;
      background: #ffffff;
      border: 2px solid var(--line, #e2e8f0);
      border-radius: 50px;
      padding: 6px 10px 6px 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .search-input-wrapper:focus-within {
      border-color: var(--gold-500, #c9a55c);
      box-shadow: 0 6px 24px rgba(201, 165, 92, 0.2);
    }

    .search-main-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 1.05rem;
      color: var(--navy-900, #0c1a30);
      background: transparent;
      padding: 8px 0;
      font-family: inherit;
    }

    .search-main-btn {
      background: var(--gold-500, #c9a55c);
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      border-radius: 40px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: inherit;
      transition: background 0.2s ease, transform 0.1s ease;
    }

    .search-main-btn:hover {
      background: #b38e47;
      transform: translateY(-1px);
    }

    .search-category-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 20px;
    }

    .category-filter-btn {
      background: #ffffff;
      border: 1px solid var(--line, #e2e8f0);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--navy-800, #1e3a5f);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.2s ease;
    }

    .category-filter-btn:hover,
    .category-filter-btn.active {
      background: var(--navy-900, #0c1a30);
      color: #ffffff;
      border-color: var(--navy-900, #0c1a30);
    }

    .search-meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line, #e2e8f0);
    }

    .search-count {
      font-weight: 600;
      color: var(--navy-900, #0c1a30);
      font-size: 1.05rem;
    }

    .search-product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
    }

    .search-empty {
      text-align: center;
      padding: 60px 20px;
      background: #ffffff;
      border-radius: 12px;
      border: 1px dashed var(--line, #cbd5e1);
      grid-column: 1 / -1;
    }

    .search-empty svg {
      color: #94a3b8;
      margin-bottom: 16px;
    }

    .search-empty h3 {
      font-size: 1.3rem;
      color: var(--navy-900, #0c1a30);
      margin-bottom: 8px;
    }

    .search-empty p {
      color: #64748b;
      margin-bottom: 20px;
    }

    .item-category-tag {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 700;
      color: var(--gold-500, #c9a55c);
      margin-bottom: 4px;
      display: block;
    }

    .product-category-link {
      display: block;
      margin-top: 10px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--navy-800, #1e3a5f);
      text-decoration: none;
      text-align: center;
      transition: color 0.2s ease;
    }

    .product-category-link:hover {
      color: var(--gold-500, #c9a55c);
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div id="header-placeholder"></div>

  <section class="page-hero">
    <img class="hero-video"
      src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?q=80&w=1920&auto=format&fit=crop"
      alt="Search Madhav Polymers Products" />
    <div class="hero-overlay"></div>
    <div class="wrap">
      <span class="kicker">Product Catalog Search</span>
      <h1>Search Products &amp; Profiles</h1>
      <p class="lede">Search across all 140+ sealing gaskets, UPVC profiles, and aluminium sections by code or name.</p>
    </div>
  </section>

  <section class="search-page-section">
    <div class="wrap">
      <div class="search-header-box">
        <form id="pageSearchForm" class="search-input-wrapper">
          <input type="text" id="pageSearchInput" class="search-main-input" placeholder="Search by code (e.g. M47, SS-178, M4030, CT01) or name..." autofocus>
          <button type="submit" class="search-main-btn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor">
              <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5A6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5S14 7.01 14 9.5S11.99 14 9.5 14z" />
            </svg>
            Search
          </button>
        </form>

        <div class="search-category-filters" id="categoryFilters">
          <button class="category-filter-btn active" data-cat="all">All Products</button>
          <button class="category-filter-btn" data-cat="uPVC Window Gasket">uPVC Gaskets</button>
          <button class="category-filter-btn" data-cat="Aluminium Section">Aluminium Sections</button>
          <button class="category-filter-btn" data-cat="Hand Railing Gasket">Hand Railing</button>
          <button class="category-filter-btn" data-cat="Kitchen & Wardrobe Profile">Kitchen &amp; Wardrobe</button>
          <button class="category-filter-btn" data-cat="Office Partition System">Office Partition</button>
          <button class="category-filter-btn" data-cat="Curtain Wall Gasket">Curtain Wall</button>
          <button class="category-filter-btn" data-cat="TPE / TPV Gasket">TPE / TPV</button>
          <button class="category-filter-btn" data-cat="Wedge & Cord Gasket">Wedge &amp; Cord</button>
        </div>
      </div>

      <div class="search-meta-bar">
        <div class="search-count" id="resultsCountText">Loading products...</div>
      </div>

      <div class="search-product-grid" id="searchResultsGrid">
        <!-- Product item cards will be rendered dynamically -->
      </div>
    </div>
  </section>

  <div id="footer-placeholder"></div>

  <script src="js/products-data.js"></script>
  <script src="js/main.js"></script>
  <script>
    const resultsGrid = document.getElementById('searchResultsGrid');
    const resultsCountText = document.getElementById('resultsCountText');
    const pageSearchInput = document.getElementById('pageSearchInput');
    const pageSearchForm = document.getElementById('pageSearchForm');
    const filterButtons = document.querySelectorAll('.category-filter-btn');

    let currentCategory = 'all';

    function performSearch() {
      const query = (pageSearchInput.value || '').trim().toLowerCase();
      
      let filtered = (typeof allProductsDatabase !== 'undefined') ? allProductsDatabase : [];

      if (currentCategory !== 'all') {
        filtered = filtered.filter(p => p.category === currentCategory);
      }

      if (query) {
        filtered = filtered.filter(p => {
          const titleMatch = p.title.toLowerCase().includes(query);
          const codeMatch = p.code.toLowerCase().includes(query);
          const catMatch = p.category.toLowerCase().includes(query);
          const specsMatch = p.specs && p.specs.some(s => 
            s.label.toLowerCase().includes(query) || s.val.toLowerCase().includes(query)
          );
          return titleMatch || codeMatch || catMatch || specsMatch;
        });
      }

      renderProducts(filtered, query);
    }

    function renderProducts(items, query) {
      if (items.length === 0) {
        resultsCountText.textContent = query 
          ? `0 products found for "${query}"`
          : `No products found in this category`;
        resultsGrid.innerHTML = `
          <div class="search-empty">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <h3>No matching products found</h3>
            <p>Try searching with another product code (e.g. M47, SS-178, M4030) or profile type.</p>
            <a href="contact.html" class="btn btn-gold" style="display:inline-block;">Request Custom Profile</a>
          </div>
        `;
        return;
      }

      resultsCountText.textContent = query
        ? `Found ${items.length} product${items.length > 1 ? 's' : ''} matching "${query}"`
        : `Showing ${items.length} products`;

      resultsGrid.innerHTML = items.map(p => {
        const specsHtml = p.specs && p.specs.length > 0 
          ? p.specs.map(s => `
              <div>
                <span class="spec-lbl">${s.label}</span>
                <span class="spec-val">${s.val}</span>
              </div>
            `).join('')
          : '';

        const qtyHtml = p.qty 
          ? `<div class="item-qty-row"><span class="qty-lbl">Qty. Box/Bag</span><span class="qty-val">${p.qty}</span></div>`
          : '';

        const fullName = `${p.title} (${p.code})`;
        const waText = encodeURIComponent(`Hello, I want to inquire about: ${p.title} - Code: ${p.code} (Category: ${p.category})`);

        return `
          <div class="product-item-card">
            <div class="product-image-container">
              <img src="${p.img}" alt="${p.title} ${p.code}" loading="lazy" />
            </div>
            <div class="product-item-details">
              <span class="item-category-tag">${p.category}</span>
              <h3 class="item-title">${p.title}</h3>
              <div class="item-code-badge">${p.code}</div>
              ${specsHtml ? `<div class="item-specs-grid">${specsHtml}</div>` : ''}
              ${qtyHtml}
              <div class="item-actions">
                <a href="#quote" class="btn-quote" data-product="${fullName}">Get Quote</a>
                <a href="https://wa.me/919355761001?text=${waText}" target="_blank" class="btn-whatsapp">WhatsApp</a>
              </div>
              <a href="${p.pageUrl}" class="product-category-link">View Full Range &rarr;</a>
            </div>
          </div>
        `;
      }).join('');
    }

    // Category filter click handler
    filterButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        filterButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentCategory = btn.getAttribute('data-cat');
        performSearch();
      });
    });

    // Form and real-time input
    pageSearchForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = pageSearchInput.value.trim();
      const newUrl = val ? `search.html?q=${encodeURIComponent(val)}` : 'search.html';
      window.history.pushState({}, '', newUrl);
      performSearch();
    });

    pageSearchInput.addEventListener('input', () => {
      performSearch();
    });

    // Read initial URL parameter
    const urlParams = new URLSearchParams(window.location.search);
    const initialQuery = urlParams.get('q') || '';
    if (initialQuery) {
      pageSearchInput.value = initialQuery;
    }
    
    // Initial run
    performSearch();
  </script>
</body>

</html>

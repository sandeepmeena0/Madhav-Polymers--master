<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 150" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&amp;family=Outfit:wght@600;700&amp;display=swap');
      .dw-gold { fill: #C89938; }
      .dw-grey { fill: #52565B; }
      .dw-dark { fill: #222222; }
      .dw-sub { fill: #333333; font-family: 'Montserrat', sans-serif; font-weight: 700; }
      .dw-tag { fill: #3A3A3A; font-family: system-ui, -apple-system, sans-serif; font-weight: 500; }
    </style>
  </defs>

  <!-- Isometric Window Frame Icon -->
  <g transform="translate(15, 12)">
    <!-- Back Window Pane 1 -->
    <path d="M12,24 L22,14 L22,90 L12,98 Z" fill="#DDBB70" opacity="0.65"/>
    <path d="M22,14 L30,6 L30,82 L22,90 Z" fill="#C89938" opacity="0.8"/>
    <!-- Middle Window Pane 2 -->
    <path d="M28,20 L38,10 L38,98 L28,106 Z" fill="#DDBB70" opacity="0.75"/>
    <path d="M38,10 L50,0 L50,90 L38,98 Z" fill="#C89938" opacity="0.9"/>
    <!-- Front Main Window Frame -->
    <path d="M46,16 L92,0 L92,108 L46,122 Z" fill="#C89938" />
    <path d="M51,20 L87,8 L87,104 L51,116 Z" fill="#FFFFFF" />
    <!-- Panes / Glass dividers -->
    <!-- Vertical Bar -->
    <path d="M66,15 L71,13 L71,110 L66,112 Z" fill="#C89938" />
    <!-- Horizontal Bar -->
    <path d="M51,68 L87,56 L87,62 L51,74 Z" fill="#C89938" />
    <!-- Base Sill Depth -->
    <polygon points="42,122 46,122 92,108 94,110 46,125" fill="#A47722" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(125, 12)">
    <text x="0" y="65" font-family="'Montserrat', sans-serif" font-size="64" font-weight="700" letter-spacing="-1">
      <tspan fill="#C89938">Do</tspan><tspan fill="#52565B">W</tspan><tspan fill="#C89938">in</tspan>
    </text>
    <text x="2" y="94" class="dw-sub" font-size="24" letter-spacing="0.5">Solutions Pvt. Ltd.</text>
    <line x1="2" y1="108" x2="305" y2="108" stroke="#333333" stroke-width="1.8" />
    <text x="153" y="125" class="dw-tag" font-size="14" letter-spacing="2.5" text-anchor="middle">DOORS &amp; WINDOWS</text>
  </g>
</svg>
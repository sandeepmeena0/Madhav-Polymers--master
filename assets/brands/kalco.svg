<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 140" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&amp;family=Open+Sans:wght@600&amp;display=swap');
      .kalco-title { fill: #111111; font-family: 'Montserrat', sans-serif; font-weight: 800; }
      .kalco-sub { fill: #333333; font-family: 'Open Sans', sans-serif; font-weight: 600; }
    </style>
  </defs>

  <!-- Iconic Chevron Arrow < -->
  <g transform="translate(15, 12)">
    <!-- Top diagonal arm: Vibrant Lime Green -->
    <polygon points="38,0 82,44 58,68 14,24" fill="#78BE20" />
    <!-- Bottom diagonal arm: Deep Vivid Royal Blue -->
    <polygon points="14,28 58,72 82,96 38,140 0,102 24,78" fill="#005A9C" />
  </g>

  <!-- Typography: KALCO -->
  <g transform="translate(122, 16)">
    <text x="0" y="68" class="kalco-title" font-size="70" letter-spacing="2">KALCO</text>
    <text x="2" y="99" class="kalco-sub" font-size="20" letter-spacing="0.5">Green Building Solutions</text>
  </g>
</svg>
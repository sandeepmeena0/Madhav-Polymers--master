<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video Background with Text</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

/* Container spanning full screen or hero height */
.video-container {
  position: relative;
  width: 100%;
  height: 100vh; /* Full viewport height */
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Inter', sans-serif;
}

/* Background Video Styles */
.bg-video {
  position: absolute;
  top: 50%;
  left: 50%;
  min-width: 100%;
  min-height: 100%;
  width: auto;
  height: auto;
  transform: translate(-50%, -50%);
  object-fit: cover;
  z-index: 1;
}

/* Dark Tint Overlay */
.overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.55); /* Adjust opacity (0.55) to lighten or darken */
  z-index: 2;
}

/* Centered Text Layer */
.content {
  position: relative;
  z-index: 3;
  text-align: center;
  color: #ffffff;
  padding: 0 20px;
  max-width: 800px;
}

.subheading {
  font-size: 0.875rem;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 12px;
  display: block;
}

.content h1 {
  font-family: 'Cormorant Garamond', serif, sans-serif;
  font-size: 3.5rem;
  line-height: 1.2;
  font-weight: 700;
  margin-bottom: 24px;
  text-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
}

/* Buttons */
.btn-group {
  display: flex;
  gap: 12px;
  justify-content: center;
}

.btn {
  padding: 12px 28px;
  font-size: 1rem;
  font-weight: 600;
  border-radius: 6px;
  text-decoration: none;
  transition: all 0.3s ease;
}

.btn-primary {
  background-color: #fbc02d;
  color: #1c1917;
}

.btn-primary:hover {
  background-color: #f57f17;
}

.btn-secondary {
  border: 1px solid rgba(255, 255, 255, 0.7);
  color: #ffffff;
  background: rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(4px);
}

.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.25);
}
  </style>
</head>
<body>

  <div class="video-container">
    <!-- Background Video -->
    <video autoplay loop muted playsinline class="bg-video">
      <source src="assets/WhatsApp Video 2026-09-03 at 4.40.35 PM.mp4" type="video/mp4">
      Your browser does not support HTML5 video.
    </video>

    <!-- Dark Overlay (Ensures text is easy to read) -->
    <div class="overlay"></div>

    <!-- Text Layer -->
    <div class="content">
      <span class="subheading">BEST SEALING SOLUTIONS</span>
      <h1>India's Widest Seals<br>Product Manufacturer</h1>
      <div class="btn-group">
        <a href="#" class="btn btn-primary">Explore More</a>
        <a href="#" class="btn btn-secondary">Get Quote</a>
      </div>
    </div>
  </div>

</body>
</html>
